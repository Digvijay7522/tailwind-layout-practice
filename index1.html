<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="favicon.webp" type="image/x-icon"/>
</head>
<body class="bg-gray-100">
   <div class="container  flex mt-48 mx-auto items-center justify-center">
    <div class=" left  w-1/4"><img src="./facebook.svg" alt="">
    <p class="text-2xl mx-10">Facebook helps you connect and share with the people in your life.</p>
</div>
    <div class="right flex flex-col mt-10 bg-white p-8 mx-4 rounded-md  w-1/4 shadow-xl relative">
    <input class="my-1 p-1 mx-2  border border-1 border-gray-100 rounded-md outline-blue-200" type="text" class="class" placeholder="Email adress or phone number">    
    <input class="my-1 p-1 mx-2 border border-1 border-gray-100 rounded-md outline-blue-200" type="text" class="class" placeholder="Password"> 
    <button class="my-1 bg-blue-500 my-1 p-1 rounded-md">Log In</button> 
    <span class="text-center text-sm text-blue-500 hover:cursor-pointer hover:underline ">Forgotten password?</span>
    <hr class="my-2 ">
     <button class="my-1 bg-green-500 my-1 p-1 rounded-md w-fit mx-auto p-2 ">Create new account</button> 
     <span class="absolute -bottom-12 text-sm"> <span class="font-bold">Create a Page</span>  for a celebrity, brand or business.</span>
    </div>
   </div>
</body>
</html>
